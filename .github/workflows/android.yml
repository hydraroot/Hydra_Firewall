name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
      HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make build scripts executable
        run: chmod +x ./gradlew ./build.sh

      - name: Run Android unit tests and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hydra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  python-tools:
    name: Python tools and bundled threat pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install threat-pack verifier
        run: python -m pip install --upgrade pip cryptography

      - name: Run Python unit tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Verify bundled threat-pack signature
        run: python tools/verify_threat_pack.py app/src/main/assets/hydra_threat_pack_v1.json

  release:
    name: Signed GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, python-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
      HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n1)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match version.properties (v$version)." >&2
            exit 1
          }

      - name: Configure release signing
        id: signing
        env:
          HYDRA_KEYSTORE_BASE64: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HYDRA_KEYSTORE_BASE64" || -z "$HYDRA_KEYSTORE_PASSWORD" || -z "$HYDRA_KEY_ALIAS" || -z "$HYDRA_KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release APK skipped: configure all four HYDRA_KEYSTORE_* secrets."
            exit 0
          fi
          key_file="$RUNNER_TEMP/hydra-release.jks"
          printf '%s' "$HYDRA_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          keytool -list -keystore "$key_file" -storepass "$HYDRA_KEYSTORE_PASSWORD" -alias "$HYDRA_KEY_ALIAS" >/dev/null
          {
            echo "HYDRA_KEYSTORE_FILE=$key_file"
            echo "HYDRA_KEYSTORE_PASSWORD=$HYDRA_KEYSTORE_PASSWORD"
            echo "HYDRA_KEY_ALIAS=$HYDRA_KEY_ALIAS"
            echo "HYDRA_KEY_PASSWORD=$HYDRA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK and checksum
        if: steps.signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload signed release APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hydra-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed GitHub Release
        if: steps.signing.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
