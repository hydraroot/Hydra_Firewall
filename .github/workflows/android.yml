name: Android CI and Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta existente para generar/publicar el Release (ej. v1.0.0). Vacío = solo CI.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Tests y APK Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tests de herramientas del feed de amenazas
        run: python -m unittest discover -s tools -v

      - name: Tests unitarios y compilación Debug
        env:
          HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
          HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Subir reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hydra-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir APK Debug (solo pruebas)
        uses: actions/upload-artifact@v7
        with:
          name: hydra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Compilar Release firmado y publicar APK
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      HYDRA_KEYSTORE_FILE: hydra-release.jks
      HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
      HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
      HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
      HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
      HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
      HYDRA_KEYSTORE_BASE64: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout del código etiquetado
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Configurar JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma Android 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verificar secretos de firma
        shell: bash
        run: |
          set -euo pipefail
          for name in HYDRA_KEYSTORE_BASE64 HYDRA_KEYSTORE_PASSWORD HYDRA_KEY_ALIAS HYDRA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta el secreto ${name}. Configurá los cuatro secretos de firma en Settings > Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Compilar APK Release y AAB firmados
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HYDRA_KEYSTORE_BASE64" | base64 --decode > "$HYDRA_KEYSTORE_FILE"
          test -s "$HYDRA_KEYSTORE_FILE"
          trap 'rm -f "$HYDRA_KEYSTORE_FILE"' EXIT
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/apk/release/app-release.apk "Hydra-Firewall-${RELEASE_TAG}.apk"

      - name: Subir APK y AAB como artefactos de Actions
        uses: actions/upload-artifact@v7
        with:
          name: Hydra-Firewall-${{ env.RELEASE_TAG }}-Release
          path: |
            Hydra-Firewall-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar APK firmado al GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Hydra Firewall ${{ env.RELEASE_TAG }}
          body: |
            Signed Android Release build of Hydra Firewall.

            The APK attached here is a public direct-download build. Testers enrolled in the restricted Google Play closed test should use the Google Play testing link.
          files: Hydra-Firewall-${{ env.RELEASE_TAG }}.apk
          prerelease: true
