name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.HYDRA_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests del generador de packs (Python)
        run: python3 -m unittest discover -s tools -v

      - name: Tests unitarios + APK debug
        env:
          HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
          HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Guardar reporte de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Guardar APK debug
        uses: actions/upload-artifact@v7
        with:
          name: hydra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK release firmada: solo si cargaste los secrets (ver docs/BUILD.md).
      - name: APK release firmada
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          HYDRA_KEYSTORE_FILE: hydra-release.jks
          HYDRA_KEYSTORE_PASSWORD: ${{ secrets.HYDRA_KEYSTORE_PASSWORD }}
          HYDRA_KEY_ALIAS: ${{ secrets.HYDRA_KEY_ALIAS }}
          HYDRA_KEY_PASSWORD: ${{ secrets.HYDRA_KEY_PASSWORD }}
          HYDRA_THREAT_FEED_URL: ${{ vars.HYDRA_THREAT_FEED_URL }}
          HYDRA_THREAT_PUBLIC_KEY: ${{ vars.HYDRA_THREAT_PUBLIC_KEY }}
          KS_B64: ${{ secrets.HYDRA_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > hydra-release.jks
          ./gradlew --no-daemon assembleRelease
          rm -f hydra-release.jks

      - name: Guardar APK release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hydra-release-apk
          path: app/build/outputs/apk/release/*.apk
