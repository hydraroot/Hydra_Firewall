# Única fuente de la versión de la app. Edítala con:  python tools/bump_version.py patch|minor|major
# versionName = MAYOR.MENOR.PARCHE   ->   versionCode = MAYOR*10000 + MENOR*100 + PARCHE
#   patch  (1.0.x): arreglos y cambios pequeños
#   minor  (1.x.0): funciones nuevas o cambios medianos (reinicia el parche a 0)
#   major  (x.0.0): cambios grandes (reinicia menor y parche a 0)
# Android solo actualiza una app si el versionCode es MAYOR que el instalado y la firma es la misma.
VERSION_NAME=3.1.0
