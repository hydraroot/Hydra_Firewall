distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
# distributionSha256Sum=PENDIENTE: no pude bajarlo desde este entorno (sin red a
# services.gradle.org). Antes de publicar, obtenelo y pegalo en esta línea:
#   curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip.sha256
# El resultado es un solo hash hex de 64 caracteres; esa línea queda como
# "distributionSha256Sum=<ese hash>" (sin comentario ni espacios).
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/wrapper
